name: Validate campaign analytics

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify the committed REAL dataset matches its provenance
        run: |
          expected=$(grep 'Prepared file SHA256' data/REAL_DATA_PROVENANCE.md | grep -oE '[0-9a-f]{64}')
          actual=$(sha256sum data/online_retail_orders.csv | cut -d' ' -f1)
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"

      - name: Regenerate simulated data (must be byte-stable)
        run: |
          python src/generate_campaign_data.py
          python src/generate_crm_data.py
          git diff --exit-code -- data/

      - name: Validate data
        run: python src/validate_data.py

      - name: Rebuild analyses and reports
        run: |
          python src/analyze_ab_test.py
          python src/build_summary.py
          python src/campaign_deep_dive.py
          python src/attribution.py
          python src/budget_reallocation.py
          python src/crm_retention.py
          python src/crm_lifecycle.py
          python src/build_dashboard.py
          python src/build_web_dashboard.py

      - name: Committed reports must match the code that generates them
        # A report edited by hand, or code changed without re-running it, fails
        # here instead of reaching a reviewer. Binary outputs are excluded.
        run: git diff --exit-code -- analysis reports docs/index.html

      - name: Run test suite
        run: python -m pytest -q

      - name: Cross-check notebook (pandas, DuckDB, statsmodels, NumPy)
        run: |
          python -m pip install -r requirements-notebook.txt
          python -c "import nbformat, nbclient; nb = nbformat.read('notebooks/cross_check.ipynb', as_version=4); nbclient.NotebookClient(nb, timeout=900, kernel_name='python3', resources={'metadata': {'path': 'notebooks'}}).execute()"
