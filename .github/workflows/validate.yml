name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r analisi-cv/requirements.txt

      - name: "Il foglio: i 60 casi salvati da Excel"
        run: python -m pytest -q tests

      - name: "Le prove: i numeri veri dietro due regole"
        run: |
          python prove/prove.py
          git diff --exit-code -- prove

      - name: "L'analisi del CV: dati, tabelle e pagina"
        working-directory: analisi-cv
        run: |
          expected=$(grep 'Prepared file SHA256' data/REAL_DATA_PROVENANCE.md | grep -oE '[0-9a-f]{64}')
          test "$expected" = "$(sha256sum data/online_retail_orders.csv | cut -d' ' -f1)"
          python src/validate_data.py
          python src/crm_retention.py
          python src/crm_lifecycle.py
          python src/build_dashboard.py
          python src/build_web_dashboard.py
          git diff --exit-code -- analysis ../docs/analysis.html
          python -m pytest -q

      - name: Cross-check notebook (pandas, DuckDB)
        working-directory: analisi-cv
        run: |
          python -m pip install -r requirements-notebook.txt
          python -c "import nbformat, nbclient; nb = nbformat.read('notebooks/cross_check.ipynb', as_version=4); nbclient.NotebookClient(nb, timeout=900, kernel_name='python3', resources={'metadata': {'path': 'notebooks'}}).execute()"
